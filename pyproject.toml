[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danceai"
version = "0.1.0"
description = "Dance motion analysis and comparison"
requires-python = ">=3.11"
dependencies = [
    "mediapipe",
    "opencv-python",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]

